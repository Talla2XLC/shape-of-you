name: Reusable quality

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test staging rollback readiness
        run: sh deploy/staging/scripts/tests/rollback-readiness.sh

      - name: Test staging write smoke contract
        run: sh deploy/staging/scripts/tests/write-smoke-contract.sh

      - name: Test staging TLS automation contract
        run: sh deploy/staging/scripts/tests/tls-automation-contract.sh

      - name: Test Identity deployment contract
        run: sh deploy/staging/scripts/tests/identity-deployment-contract.sh

      - name: Test stable deployment bootstrap contract
        run: sh deploy/staging/scripts/tests/deployment-bootstrap-contract.sh

      - name: Test Fitness Tracker importer deployment contract
        run: sh deploy/staging/scripts/tests/fitness-tracker-import-contract.sh

      - name: Test frontend edge contract
        run: sh deploy/staging/scripts/tests/frontend-edge-contract.sh

      - name: Test frontend edge runtime
        run: sh deploy/staging/scripts/tests/frontend-edge-runtime.sh

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Test local API and Identity stack
        run: pnpm test:e2e

      - name: Install frontend E2E browser
        run: pnpm --filter @shape-of-you/web exec playwright install --with-deps chromium

      - name: Test Identity OAuth browser contracts
        run: pnpm test:e2e:identity

      - name: Test frontend browser contracts
        run: pnpm test:e2e:web

      - name: Test complete browser authentication flow
        run: pnpm test:e2e:browser-auth

      - name: Validate canonical documentation
        run: node scripts/validate-docs.mjs
