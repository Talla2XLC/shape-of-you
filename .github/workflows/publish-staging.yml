name: Publish staging images

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'plans/**'

permissions:
  contents: read
  packages: read

jobs:
  quality:
    uses: ./.github/workflows/_quality.yml

  identity-changes:
    runs-on: ubuntu-latest
    outputs:
      deploy_identity: ${{ steps.classify.outputs.deploy_identity }}
      expected_staging_base: ${{ steps.classify.outputs.expected_staging_base }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify Identity delivery
        id: classify
        shell: bash
        env:
          BEFORE_REVISION: ${{ github.event.before }}
          AFTER_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            deploy_identity=true
            expected_staging_base=
          else
            deploy_identity=$(sh deploy/staging/scripts/detect-identity-change.sh \
              "$BEFORE_REVISION" "$AFTER_REVISION")
            if [ "$deploy_identity" = false ]; then
              printf '%s\n' "$BEFORE_REVISION" | grep -Eq '^[0-9a-f]{40}$'
              expected_staging_base=$BEFORE_REVISION
            else
              expected_staging_base=
            fi
          fi
          printf 'deploy_identity=%s\n' "$deploy_identity" >> "$GITHUB_OUTPUT"
          printf 'expected_staging_base=%s\n' "$expected_staging_base" >> "$GITHUB_OUTPUT"

  publish-api:
    needs: quality
    concurrency:
      group: publish-staging-api-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish API image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/${{ vars.GHCR_NAMESPACE }}/shape-of-you-api:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Wait for API image manifest
        shell: bash
        env:
          IMAGE: ghcr.io/${{ vars.GHCR_NAMESPACE }}/shape-of-you-api
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          if docker buildx imagetools inspect "$IMAGE@$DIGEST" >/dev/null 2>&1; then
            exit 0
          fi

          for delay in 1 2 4 8 16; do
            sleep "$delay"

            if docker buildx imagetools inspect "$IMAGE@$DIGEST" >/dev/null 2>&1; then
              exit 0
            fi
          done

          printf 'Image manifest did not become readable: %s@%s\n' "$IMAGE" "$DIGEST" >&2
          exit 1

      - name: Attest API image
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ vars.GHCR_NAMESPACE }}/shape-of-you-api
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Publish API digest
        run: |
          printf '### API image\n\n`%s@%s`\n' \
            "ghcr.io/${{ vars.GHCR_NAMESPACE }}/shape-of-you-api" \
            "${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  publish-identity:
    needs:
      - quality
      - identity-changes
    if: needs.identity-changes.outputs.deploy_identity == 'true'
    concurrency:
      group: publish-staging-identity-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish Identity image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/identity/Dockerfile
          push: true
          tags: ghcr.io/${{ vars.GHCR_NAMESPACE }}/shape-of-you-identity:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Wait for Identity image manifest
        shell: bash
        env:
          IMAGE: ghcr.io/${{ vars.GHCR_NAMESPACE }}/shape-of-you-identity
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          if docker buildx imagetools inspect "$IMAGE@$DIGEST" >/dev/null 2>&1; then
            exit 0
          fi

          for delay in 1 2 4 8 16; do
            sleep "$delay"

            if docker buildx imagetools inspect "$IMAGE@$DIGEST" >/dev/null 2>&1; then
              exit 0
            fi
          done

          printf 'Image manifest did not become readable: %s@%s\n' "$IMAGE" "$DIGEST" >&2
          exit 1

      - name: Attest Identity image
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ vars.GHCR_NAMESPACE }}/shape-of-you-identity
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Publish Identity digest
        run: |
          printf '### Identity image\n\n`%s@%s`\n' \
            "ghcr.io/${{ vars.GHCR_NAMESPACE }}/shape-of-you-identity" \
            "${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  publish-edge:
    needs: quality
    concurrency:
      group: publish-staging-edge-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish edge image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/staging/nginx/Dockerfile
          push: true
          tags: ghcr.io/${{ vars.GHCR_NAMESPACE }}/shape-of-you-edge:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Wait for edge image manifest
        shell: bash
        env:
          IMAGE: ghcr.io/${{ vars.GHCR_NAMESPACE }}/shape-of-you-edge
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          if docker buildx imagetools inspect "$IMAGE@$DIGEST" >/dev/null 2>&1; then
            exit 0
          fi

          for delay in 1 2 4 8 16; do
            sleep "$delay"

            if docker buildx imagetools inspect "$IMAGE@$DIGEST" >/dev/null 2>&1; then
              exit 0
            fi
          done

          printf 'Image manifest did not become readable: %s@%s\n' "$IMAGE" "$DIGEST" >&2
          exit 1

      - name: Attest edge image
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ vars.GHCR_NAMESPACE }}/shape-of-you-edge
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Publish edge digest
        run: |
          printf '### Edge image\n\n`%s@%s`\n' \
            "ghcr.io/${{ vars.GHCR_NAMESPACE }}/shape-of-you-edge" \
            "${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  publish-certbot:
    needs: quality
    concurrency:
      group: publish-staging-certbot-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish Certbot image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: deploy/staging/certbot
          file: deploy/staging/certbot/Dockerfile
          push: true
          tags: ghcr.io/${{ vars.GHCR_NAMESPACE }}/shape-of-you-certbot:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Wait for Certbot image manifest
        shell: bash
        env:
          IMAGE: ghcr.io/${{ vars.GHCR_NAMESPACE }}/shape-of-you-certbot
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          if docker buildx imagetools inspect "$IMAGE@$DIGEST" >/dev/null 2>&1; then
            exit 0
          fi

          for delay in 1 2 4 8 16; do
            sleep "$delay"

            if docker buildx imagetools inspect "$IMAGE@$DIGEST" >/dev/null 2>&1; then
              exit 0
            fi
          done

          printf 'Image manifest did not become readable: %s@%s\n' "$IMAGE" "$DIGEST" >&2
          exit 1

      - name: Attest Certbot image
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ vars.GHCR_NAMESPACE }}/shape-of-you-certbot
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Publish Certbot digest
        run: |
          printf '### Certbot image\n\n`%s@%s`\n' \
            "ghcr.io/${{ vars.GHCR_NAMESPACE }}/shape-of-you-certbot" \
            "${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  release-candidate:
    needs:
      - quality
      - identity-changes
      - publish-api
      - publish-identity
      - publish-edge
      - publish-certbot
    if: >-
      always() &&
      needs.quality.result == 'success' &&
      needs.identity-changes.result == 'success' &&
      needs.publish-api.result == 'success' &&
      ((needs.identity-changes.outputs.deploy_identity == 'true' && needs.publish-identity.result == 'success') ||
       (needs.identity-changes.outputs.deploy_identity == 'false' && needs.publish-identity.result == 'skipped')) &&
      needs.publish-edge.result == 'success' &&
      needs.publish-certbot.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      SOURCE_REPOSITORY: ${{ github.repository }}
      SOURCE_RUN_ID: ${{ github.run_id }}
      RELEASE_ID: ${{ github.sha }}
      API_DIGEST: ${{ needs.publish-api.outputs.digest }}
      DEPLOY_IDENTITY: ${{ needs.identity-changes.outputs.deploy_identity }}
      EXPECTED_STAGING_BASE: ${{ needs.identity-changes.outputs.expected_staging_base }}
      IDENTITY_DIGEST: ${{ needs.publish-identity.outputs.digest }}
      EDGE_DIGEST: ${{ needs.publish-edge.outputs.digest }}
      CERTBOT_DIGEST: ${{ needs.publish-certbot.outputs.digest }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Write exact staging release candidate
        shell: bash
        run: sh deploy/staging/scripts/write-release-candidate.sh candidate.env

      - name: Upload staging release candidate
        uses: actions/upload-artifact@v4
        with:
          name: staging-release-candidate-${{ github.sha }}
          path: candidate.env
          if-no-files-found: error
          retention-days: 30
