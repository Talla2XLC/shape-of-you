name: Publish staging images

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  quality:
    uses: ./.github/workflows/_quality.yml

  publish-api:
    needs: quality
    concurrency:
      group: publish-staging-api-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish API image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/${{ vars.GHCR_NAMESPACE }}/shape-of-you-api:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Wait for API image manifest
        shell: bash
        env:
          IMAGE: ghcr.io/${{ vars.GHCR_NAMESPACE }}/shape-of-you-api
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          if docker buildx imagetools inspect "$IMAGE@$DIGEST" >/dev/null 2>&1; then
            exit 0
          fi

          for delay in 1 2 4 8 16; do
            sleep "$delay"

            if docker buildx imagetools inspect "$IMAGE@$DIGEST" >/dev/null 2>&1; then
              exit 0
            fi
          done

          printf 'Image manifest did not become readable: %s@%s\n' "$IMAGE" "$DIGEST" >&2
          exit 1

      - name: Attest API image
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ vars.GHCR_NAMESPACE }}/shape-of-you-api
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Publish API digest
        run: |
          printf '### API image\n\n`%s@%s`\n' \
            "ghcr.io/${{ vars.GHCR_NAMESPACE }}/shape-of-you-api" \
            "${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  publish-identity:
    needs: quality
    concurrency:
      group: publish-staging-identity-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish Identity image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/identity/Dockerfile
          push: true
          tags: ghcr.io/${{ vars.GHCR_NAMESPACE }}/shape-of-you-identity:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Wait for Identity image manifest
        shell: bash
        env:
          IMAGE: ghcr.io/${{ vars.GHCR_NAMESPACE }}/shape-of-you-identity
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          if docker buildx imagetools inspect "$IMAGE@$DIGEST" >/dev/null 2>&1; then
            exit 0
          fi

          for delay in 1 2 4 8 16; do
            sleep "$delay"

            if docker buildx imagetools inspect "$IMAGE@$DIGEST" >/dev/null 2>&1; then
              exit 0
            fi
          done

          printf 'Image manifest did not become readable: %s@%s\n' "$IMAGE" "$DIGEST" >&2
          exit 1

      - name: Attest Identity image
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ vars.GHCR_NAMESPACE }}/shape-of-you-identity
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Publish Identity digest
        run: |
          printf '### Identity image\n\n`%s@%s`\n' \
            "ghcr.io/${{ vars.GHCR_NAMESPACE }}/shape-of-you-identity" \
            "${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  publish-edge:
    needs: quality
    concurrency:
      group: publish-staging-edge-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish edge image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: deploy/staging/nginx
          file: deploy/staging/nginx/Dockerfile
          push: true
          tags: ghcr.io/${{ vars.GHCR_NAMESPACE }}/shape-of-you-edge:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Wait for edge image manifest
        shell: bash
        env:
          IMAGE: ghcr.io/${{ vars.GHCR_NAMESPACE }}/shape-of-you-edge
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          if docker buildx imagetools inspect "$IMAGE@$DIGEST" >/dev/null 2>&1; then
            exit 0
          fi

          for delay in 1 2 4 8 16; do
            sleep "$delay"

            if docker buildx imagetools inspect "$IMAGE@$DIGEST" >/dev/null 2>&1; then
              exit 0
            fi
          done

          printf 'Image manifest did not become readable: %s@%s\n' "$IMAGE" "$DIGEST" >&2
          exit 1

      - name: Attest edge image
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ vars.GHCR_NAMESPACE }}/shape-of-you-edge
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Publish edge digest
        run: |
          printf '### Edge image\n\n`%s@%s`\n' \
            "ghcr.io/${{ vars.GHCR_NAMESPACE }}/shape-of-you-edge" \
            "${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  publish-certbot:
    needs: quality
    concurrency:
      group: publish-staging-certbot-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish Certbot image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: deploy/staging/certbot
          file: deploy/staging/certbot/Dockerfile
          push: true
          tags: ghcr.io/${{ vars.GHCR_NAMESPACE }}/shape-of-you-certbot:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Wait for Certbot image manifest
        shell: bash
        env:
          IMAGE: ghcr.io/${{ vars.GHCR_NAMESPACE }}/shape-of-you-certbot
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          if docker buildx imagetools inspect "$IMAGE@$DIGEST" >/dev/null 2>&1; then
            exit 0
          fi

          for delay in 1 2 4 8 16; do
            sleep "$delay"

            if docker buildx imagetools inspect "$IMAGE@$DIGEST" >/dev/null 2>&1; then
              exit 0
            fi
          done

          printf 'Image manifest did not become readable: %s@%s\n' "$IMAGE" "$DIGEST" >&2
          exit 1

      - name: Attest Certbot image
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ vars.GHCR_NAMESPACE }}/shape-of-you-certbot
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Publish Certbot digest
        run: |
          printf '### Certbot image\n\n`%s@%s`\n' \
            "ghcr.io/${{ vars.GHCR_NAMESPACE }}/shape-of-you-certbot" \
            "${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  deploy-staging:
    needs:
      - publish-api
      - publish-identity
      - publish-edge
      - publish-certbot
    uses: ./.github/workflows/deploy-staging.yml
    with:
      release_id: ${{ github.sha }}
      api_digest: ${{ needs.publish-api.outputs.digest }}
      identity_digest: ${{ needs.publish-identity.outputs.digest }}
      edge_digest: ${{ needs.publish-edge.outputs.digest }}
      certbot_digest: ${{ needs.publish-certbot.outputs.digest }}
      schema_backward_compatible: false
      identity_schema_backward_compatible: false
      run_write_smoke: true
    secrets: inherit
