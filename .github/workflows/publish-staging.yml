name: Publish staging images

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/_quality.yml

  publish-api:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish API image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/${{ vars.GHCR_NAMESPACE }}/shape-of-you-api:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Attest API image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ vars.GHCR_NAMESPACE }}/shape-of-you-api
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Publish API digest
        run: |
          printf '### API image\n\n`%s@%s`\n' \
            "ghcr.io/${{ vars.GHCR_NAMESPACE }}/shape-of-you-api" \
            "${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  publish-edge:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish edge image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: deploy/staging/nginx
          file: deploy/staging/nginx/Dockerfile
          push: true
          tags: ghcr.io/${{ vars.GHCR_NAMESPACE }}/shape-of-you-edge:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Attest edge image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ vars.GHCR_NAMESPACE }}/shape-of-you-edge
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Publish edge digest
        run: |
          printf '### Edge image\n\n`%s@%s`\n' \
            "ghcr.io/${{ vars.GHCR_NAMESPACE }}/shape-of-you-edge" \
            "${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
