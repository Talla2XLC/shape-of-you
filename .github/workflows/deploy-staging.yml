name: Deploy staging

on:
  workflow_call:
    inputs:
      release_id:
        required: true
        type: string
      api_digest:
        required: true
        type: string
      identity_digest:
        required: true
        type: string
      edge_digest:
        required: true
        type: string
      certbot_digest:
        required: true
        type: string
      schema_backward_compatible:
        required: true
        type: boolean
      identity_schema_backward_compatible:
        required: true
        type: boolean
      identity_oauth_clients_backward_compatible:
        required: true
        type: boolean
      run_write_smoke:
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      release_id:
        description: Full 40-character Git commit SHA
        required: true
        type: string
      api_digest:
        description: Published API sha256 digest
        required: true
        type: string
      identity_digest:
        description: Published Identity sha256 digest
        required: true
        type: string
      edge_digest:
        description: Published edge sha256 digest
        required: true
        type: string
      certbot_digest:
        description: Published Certbot sha256 digest
        required: true
        type: string
      schema_backward_compatible:
        description: Previous API image can run after this migration
        required: true
        default: false
        type: boolean
      identity_schema_backward_compatible:
        description: Previous Identity image can run after this migration
        required: true
        default: false
        type: boolean
      identity_oauth_clients_backward_compatible:
        description: Previous Identity image supports the reconciled predefined OAuth clients
        required: true
        default: false
        type: boolean
      run_write_smoke:
        description: Create a synthetic WeightMeasurement during smoke
        required: true
        default: true
        type: boolean

concurrency:
  group: shape-of-you-staging
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: https://staging.shape-of-you.ru/

    env:
      VM_HOST: ${{ vars.STAGING_VM_HOST }}
      VM_USER: ${{ vars.STAGING_VM_USER }}
      VM_PORT: ${{ vars.STAGING_VM_PORT }}
      GHCR_NAMESPACE: ${{ vars.GHCR_NAMESPACE }}
      RELEASE_ID: ${{ inputs.release_id }}
      API_DIGEST: ${{ inputs.api_digest }}
      IDENTITY_DIGEST: ${{ inputs.identity_digest }}
      EDGE_DIGEST: ${{ inputs.edge_digest }}
      CERTBOT_DIGEST: ${{ inputs.certbot_digest }}
      ACME_EMAIL: ${{ vars.STAGING_ACME_EMAIL }}
      PUBLIC_IPV4: ${{ vars.STAGING_PUBLIC_IPV4 }}
      DEPLOYMENT_TOPOLOGY: ${{ vars.STAGING_DEPLOYMENT_TOPOLOGY || 'shared-ingress' }}
      SCHEMA_BACKWARD_COMPATIBLE: ${{ inputs.schema_backward_compatible }}
      IDENTITY_SCHEMA_BACKWARD_COMPATIBLE: ${{ inputs.identity_schema_backward_compatible }}
      IDENTITY_OAUTH_CLIENTS_BACKWARD_COMPATIBLE: ${{ inputs.identity_oauth_clients_backward_compatible }}
      RUN_WRITE_SMOKE: ${{ inputs.run_write_smoke }}

    steps:
      - name: Validate deployment inputs
        shell: bash
        run: |
          set -eu
          printf '%s\n' "$RELEASE_ID" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s\n' "$API_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'
          printf '%s\n' "$IDENTITY_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'
          printf '%s\n' "$EDGE_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'
          printf '%s\n' "$CERTBOT_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'
          printf '%s\n' "$ACME_EMAIL" | grep -Eq '^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$'
          printf '%s\n' "$PUBLIC_IPV4" | grep -Eq '^([0-9]{1,3}\.){3}[0-9]{1,3}$'
          printf '%s\n' "$DEPLOYMENT_TOPOLOGY" | grep -Eq '^(shared-ingress|standalone)$'
          printf '%s\n' "$VM_HOST" | grep -Eq '^[A-Za-z0-9.-]+$'
          test "$VM_USER" = 'shape-deploy'
          printf '%s\n' "$VM_PORT" | grep -Eq '^[0-9]{1,5}$'
          printf '%s\n' "$GHCR_NAMESPACE" | grep -Eq '^[a-z0-9][a-z0-9._-]*$'

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_VM_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_VM_KNOWN_HOSTS }}
        run: |
          set -eu
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Run restricted staging deployment wrapper
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          IDENTITY_DATABASE_URL: ${{ secrets.STAGING_IDENTITY_DATABASE_URL }}
          IDENTITY_TOTP_ACTIVE_KEY_ID: ${{ vars.STAGING_IDENTITY_TOTP_ACTIVE_KEY_ID }}
          IDENTITY_TOTP_ENCRYPTION_KEYS: ${{ secrets.STAGING_IDENTITY_TOTP_ENCRYPTION_KEYS }}
          IDENTITY_OAUTH_ACTIVE_SIGNING_KEY_ID: ${{ vars.STAGING_IDENTITY_OAUTH_ACTIVE_SIGNING_KEY_ID }}
          IDENTITY_OAUTH_SIGNING_KEYS: ${{ secrets.STAGING_IDENTITY_OAUTH_SIGNING_KEYS }}
          IDENTITY_OAUTH_COOKIE_KEYS: ${{ secrets.STAGING_IDENTITY_OAUTH_COOKIE_KEYS }}
          IDENTITY_CHATGPT_REDIRECT_URI: ${{ vars.STAGING_IDENTITY_CHATGPT_REDIRECT_URI }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test -n "$DATABASE_URL"
          test -n "$IDENTITY_DATABASE_URL"
          test -n "$IDENTITY_TOTP_ACTIVE_KEY_ID"
          test -n "$IDENTITY_TOTP_ENCRYPTION_KEYS"
          test -n "$IDENTITY_OAUTH_ACTIVE_SIGNING_KEY_ID"
          test -n "$IDENTITY_OAUTH_SIGNING_KEYS"
          test -n "$IDENTITY_OAUTH_COOKIE_KEYS"
          test -n "$IDENTITY_CHATGPT_REDIRECT_URI"
          printf '%s\n' "$IDENTITY_CHATGPT_REDIRECT_URI" |
            grep -Eq '^https://chatgpt\.com/connector/oauth/[A-Za-z0-9_-]{8,200}$'
          test -n "$GHCR_TOKEN"
          target="$VM_USER@$VM_HOST"
          {
            printf 'RELEASE_ID=%s\n' "$RELEASE_ID"
            printf 'API_DIGEST=%s\n' "$API_DIGEST"
            printf 'IDENTITY_DIGEST=%s\n' "$IDENTITY_DIGEST"
            printf 'EDGE_DIGEST=%s\n' "$EDGE_DIGEST"
            printf 'CERTBOT_DIGEST=%s\n' "$CERTBOT_DIGEST"
            printf 'ACME_EMAIL=%s\n' "$ACME_EMAIL"
            printf 'PUBLIC_IPV4=%s\n' "$PUBLIC_IPV4"
            printf 'DEPLOYMENT_TOPOLOGY=%s\n' "$DEPLOYMENT_TOPOLOGY"
            printf 'SCHEMA_BACKWARD_COMPATIBLE=%s\n' "$SCHEMA_BACKWARD_COMPATIBLE"
            printf 'IDENTITY_SCHEMA_BACKWARD_COMPATIBLE=%s\n' "$IDENTITY_SCHEMA_BACKWARD_COMPATIBLE"
            printf 'IDENTITY_OAUTH_CLIENTS_BACKWARD_COMPATIBLE=%s\n' "$IDENTITY_OAUTH_CLIENTS_BACKWARD_COMPATIBLE"
            printf 'RUN_WRITE_SMOKE=%s\n' "$RUN_WRITE_SMOKE"
            printf 'GHCR_NAMESPACE=%s\n' "$GHCR_NAMESPACE"
            printf 'GHCR_ACTOR=%s\n' "$GITHUB_ACTOR"
            printf 'CONTROL_SHA=%s\n' "$GITHUB_SHA"
            printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
            printf 'IDENTITY_DATABASE_URL=%s\n' "$IDENTITY_DATABASE_URL"
            printf 'IDENTITY_TOTP_ACTIVE_KEY_ID=%s\n' "$IDENTITY_TOTP_ACTIVE_KEY_ID"
            printf 'IDENTITY_TOTP_ENCRYPTION_KEYS=%s\n' "$IDENTITY_TOTP_ENCRYPTION_KEYS"
            printf 'IDENTITY_OAUTH_ACTIVE_SIGNING_KEY_ID=%s\n' "$IDENTITY_OAUTH_ACTIVE_SIGNING_KEY_ID"
            printf 'IDENTITY_OAUTH_SIGNING_KEYS=%s\n' "$IDENTITY_OAUTH_SIGNING_KEYS"
            printf 'IDENTITY_OAUTH_COOKIE_KEYS=%s\n' "$IDENTITY_OAUTH_COOKIE_KEYS"
            printf 'IDENTITY_CHATGPT_REDIRECT_URI=%s\n' "$IDENTITY_CHATGPT_REDIRECT_URI"
            printf 'GHCR_TOKEN=%s\n' "$GHCR_TOKEN"
          } | ssh -p "$VM_PORT" "$target" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "sudo -n /usr/local/sbin/shape-of-you-staging-deploy"
