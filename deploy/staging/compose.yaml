services:
  edge:
    image: "${EDGE_IMAGE:?EDGE_IMAGE is required}@${EDGE_DIGEST:?EDGE_DIGEST is required}"
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "8080"
      - "8443"
    volumes:
      - acme_challenge:/var/www/certbot:ro
      - edge_tls:/etc/nginx/tls:ro
    networks:
      edge:
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--output-document=-",
          "http://127.0.0.1:8081/edge-health"
        ]
      interval: 10s
      timeout: 3s
      retries: 12
    mem_limit: 64m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  edge-bootstrap:
    image: "${EDGE_IMAGE:?EDGE_IMAGE is required}@${EDGE_DIGEST:?EDGE_DIGEST is required}"
    command: ["nginx", "-c", "/etc/nginx/bootstrap.conf", "-g", "daemon off;"]
    expose:
      - "8080"
    volumes:
      - acme_challenge:/var/www/certbot:ro
    networks:
      edge:
    profiles:
      - operations
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--output-document=-",
          "http://127.0.0.1:8081/edge-health"
        ]
      interval: 2s
      timeout: 2s
      retries: 15
    mem_limit: 32m
    pids_limit: 32
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "2"

  certbot:
    image: "${CERTBOT_IMAGE:?CERTBOT_IMAGE is required}@${CERTBOT_DIGEST:?CERTBOT_DIGEST is required}"
    volumes:
      - certbot_state:/etc/letsencrypt
      - certbot_work:/var/lib/letsencrypt
      - certbot_logs:/var/log/letsencrypt
      - acme_challenge:/var/www/certbot
      - edge_tls:/var/lib/shape-of-you/tls
    networks:
      - acme_egress
    profiles:
      - operations
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    mem_limit: 192m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "2"

  api:
    image: "${API_IMAGE:?API_IMAGE is required}@${API_DIGEST:?API_DIGEST is required}"
    env_file:
      - path: /etc/shape-of-you/staging/api.env
        format: raw
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: info
      PERSON_CONTEXT_MODE: authenticated
      IDENTITY_OAUTH_ISSUER: https://identity.staging.shape-of-you.ru
      IDENTITY_OAUTH_JWKS_URI: https://identity.staging.shape-of-you.ru/oauth/jwks
      IDENTITY_OAUTH_RESOURCE: https://staging.shape-of-you.ru/api/mcp
      API_BROWSER_ORIGIN: https://staging.shape-of-you.ru
      API_BROWSER_OAUTH_CLIENT_ID: shape-of-you-web-staging
      SHUTDOWN_TIMEOUT_MS: 10000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - edge
      - database_access
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 3s
      retries: 12
    mem_limit: 384m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  migrate:
    image: "${API_IMAGE:?API_IMAGE is required}@${API_DIGEST:?API_DIGEST is required}"
    command: ["node", "dist/database/migrate.js"]
    env_file:
      - path: /etc/shape-of-you/staging/api.env
        format: raw
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: info
      PERSON_CONTEXT_MODE: synthetic
      SYNTHETIC_PERSON_ID: 00000000-0000-4000-8000-000000000001
      IDENTITY_OAUTH_ISSUER: https://identity.staging.shape-of-you.ru
      IDENTITY_OAUTH_JWKS_URI: https://identity.staging.shape-of-you.ru/oauth/jwks
      IDENTITY_OAUTH_RESOURCE: https://staging.shape-of-you.ru/api/mcp
      API_BROWSER_ORIGIN: https://staging.shape-of-you.ru
      API_BROWSER_OAUTH_CLIENT_ID: shape-of-you-web-staging
      SHUTDOWN_TIMEOUT_MS: 10000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - database_access
    profiles:
      - operations
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  edge:
  database_access:
  acme_egress:

volumes:
  acme_challenge:
  certbot_logs:
  certbot_state:
  certbot_work:
  edge_tls:
