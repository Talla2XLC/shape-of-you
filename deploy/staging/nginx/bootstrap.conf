worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 128;
}

http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;

    server {
        listen 8081;
        access_log off;

        location = /edge-health {
            default_type application/json;
            return 200 '{"status":"ok","mode":"acme-bootstrap"}';
        }

        location / {
            return 404;
        }
    }

    server {
        listen 8080 default_server;
        server_name _;
        return 444;
    }

    server {
        listen 8080;
        server_name staging.shape-of-you.ru identity.staging.shape-of-you.ru;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
            try_files $uri =404;
        }

        location / {
            return 404;
        }
    }
}
